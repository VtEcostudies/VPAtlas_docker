#
# VPAtlas Docker Compose
#
# Port Scheme:
#   db=6550, api=4010, ui=8090
#

services:
  db_vp:
    container_name: db_vp
    image: db_vp
    restart: unless-stopped
    build:
      context: ./db_vp
      dockerfile: Dockerfile
    volumes:
      - ./db_data_vp:/var/lib/postgresql/data
    environment:
      - POSTGRES_HOST=db_vp
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vpatlas
    ports:
      - 6550:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vpatlas"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot migration runner - runs after db is healthy, before api starts.
  # Uses the same db image (has psql + PostGIS), mounts migration SQL files.
  # Exits 0 when done - does not stay running.
  db_migrate_vp:
    container_name: db_migrate_vp
    image: db_vp
    volumes:
      - ./db_migrate:/db_migrate:ro
    entrypoint: ["/bin/bash", "/db_migrate/migrate_internal.sh"]
    environment:
      - PGHOST=db_vp
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=vpatlas
      - MIGRATIONS_DIR=/db_migrate/migrations
      # Consumed by migration 021 via psql \getenv, so the pgfs_reader login
      # password matches what the ogc_vp container connects with. Dev default
      # mirrors migration 019; prod .env must set a real value (enforced by
      # ${PGFS_PASSWORD:?...} in docker-compose-prod.yml and by preflight_env).
      - PGFS_PASSWORD=${PGFS_PASSWORD:-pgfs_dev_only}
    depends_on:
      db_vp:
        condition: service_healthy
    restart: "no"

  api_vp:
    container_name: api_vp
    image: api_vp
    restart: unless-stopped
    build:
      context: ./api_vp
      dockerfile: Dockerfile
    volumes:
      - ./photo_data:/opt/api/photos
    environment:
      NODE_ENV: env-local

      # API connection to DB (internal Docker network)
      DB_HOST: db_vp
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: vpatlas

      # API server config
      API_PROT: http
      API_HOST: localhost
      API_PORT: 4010

      # NOTE: API_SECRET is deliberately NOT passed through here, and that is a
      # known open item rather than an oversight. Introducing it changes the JWT
      # signing key, which signs every active user out at once. Do not add it
      # without agreeing a deploy window for that forced logout first.

      # UI host config (used to build confirmation email URLs).
      # Override these in .env when developing locally (e.g. UI_HOST=localhost UI_PORT=8090).
      UI_PROT: ${UI_PROT:-https}
      UI_HOST: ${UI_HOST:-vpatlas.org}
      UI_PORT: ${UI_PORT:-80}

      # Email credentials (sourced from .env at compose project root)
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      APP_EMAIL: ${APP_EMAIL:-vpatlas@vtecostudies.org}
    ports:
      - 4010:4010
    depends_on:
      db_vp:
        condition: service_healthy
      db_migrate_vp:
        condition: service_completed_successfully

  # OGC API - Features server (pg_featureserv) over the curated `ogc` schema.
  #
  # Exists so ArcGIS Online can REFERENCE VPAtlas data live instead of ingesting
  # a periodically-overwritten copy. AGOL can only reference services speaking
  # ArcGIS REST FeatureServer or OGC API - Features; this provides the latter.
  #
  # SECURITY: pg_featureserv publishes every relation its DB role can SELECT,
  # unauthenticated. It connects as `pgfs_reader`, which has SELECT on the
  # curated ogc.* views ONLY -- never on public.* base tables, which carry
  # landowner PII. See db_migrate/migrations/019_add_ogc_features_views.sql.
  ogc_vp:
    container_name: ogc_vp
    image: pramsey/pg_featureserv:latest
    restart: unless-stopped
    environment:
      # Least-privilege reader created by migration 019. Dev password matches
      # this file's dev convention; prod overrides PGFS_PASSWORD via .env AND
      # must run: ALTER ROLE pgfs_reader PASSWORD '<same value>';
      DATABASE_URL: "postgres://pgfs_reader:${PGFS_PASSWORD:-pgfs_dev_only}@db_vp:5432/vpatlas?sslmode=disable"

      # UrlBase must be the PUBLIC origin: OGC API - Features responses are full
      # of self/next/items links, and clients (AGOL included) follow them. If it
      # is wrong, paging and collection traversal break for external callers.
      PGFS_SERVER_URLBASE: "${PGFS_URLBASE:-http://localhost:9010}"
      PGFS_SERVER_HTTPPORT: 9000

      # AGOL's Map Viewer fetches cross-origin from arcgis.com. Esri: "The server
      # must support CORS; otherwise, layers hosted on the server will not
      # function as expected." Data here is already public, so * is appropriate.
      PGFS_SERVER_CORSORIGINS: "*"

      # LIMITDEFAULT matches LIMITMAX deliberately: a request with no ?limit=
      # returns the whole collection.
      #
      # These collections exist to be consumed whole, by ArcGIS Online, QGIS and
      # anything else pointing at a feature service. A default that returned a
      # partial page would be the worst of both worlds here, because this build
      # of pg_featureserv emits neither `numberMatched` nor a `next` link -- a
      # truncated response is indistinguishable from a complete one, so a client
      # that forgot ?limit= would quietly publish a fraction of the data and
      # believe it had all of it. That has already happened once at 10000.
      #
      # The cost is that the human-browsable HTML view also loads everything.
      # Append ?limit=50 when browsing by hand.
      #
      # LIMITMAX must stay ABOVE the largest collection's feature count, for the
      # same silent-truncation reason. `offset` paging works but is
      # undiscoverable without a `next` link, so the ceiling is the only real
      # guard. ogc.mapped_pools is ~13.5k features; 50000 leaves ~3.7x headroom.
      # RAISE BOTH if a collection ever approaches it.
      PGFS_PAGING_LIMITDEFAULT: 50000
      PGFS_PAGING_LIMITMAX: 50000

      PGFS_METADATA_TITLE: "VPAtlas OGC API - Features"
      PGFS_METADATA_DESCRIPTION: "Vermont Vernal Pool Atlas - live feature access for GIS clients"
    ports:
      - 9010:9000
    depends_on:
      db_vp:
        condition: service_healthy
      db_migrate_vp:
        condition: service_completed_successfully

  ui_vp:
    container_name: ui_vp
    image: ui_vp
    restart: unless-stopped
    build:
      context: ./ui_vp
      dockerfile: Dockerfile
    environment:
      # API connection (external to Docker)
      API_PROT: https
      API_HOST: api.vpatlas.org
      API_PORT: 4010

      # UI server config (external to Docker)
      UI_PROT: https
      UI_HOST: vpatlas.org
      UI_PORT: 8090
    ports:
      - 8090:8090
    depends_on:
      - api_vp
