<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VPAtlas - Visit Detail</title>
    <link rel="stylesheet" href="/css/bootstrap_5.2.3.min.css">
    <link rel="stylesheet" href="/css/font-awesome_6.6.0.all.min.css">
    <link rel="stylesheet" href="/css/leaflet_1.9.4.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/pool_list.css">
    <link rel="stylesheet" href="./css/modal.css">
    <link rel="stylesheet" href="/css/map.css">
    <link rel="stylesheet" href="/css/visit_card.css">
    <style>
        .dv-tabs { display: none; }
        @media (max-width: 900px) {
            .dv-pane { display: none !important; height: calc(100dvh - 90px - 52px) !important; max-height: none !important; min-height: 0; }
            .dv-content[data-active-tab="detail"] .dv-pane-detail { display: block !important; }
            .dv-content[data-active-tab="map"]    .dv-pane-map    { display: block !important; }
            .dv-content[data-active-tab] .dv-pane { flex: 0 0 100%; max-width: 100%; }
            .dv-tabs {
                display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
                border-top: 1px solid #ddd; background: white; box-shadow: 0 -2px 6px rgba(0,0,0,0.08);
            }
            .dv-tab-btn {
                flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
                padding: 6px 2px; border: none; background: white; color: var(--text-secondary);
                font-size: 11px; cursor: pointer; border-radius: 0;
            }
            .dv-tab-btn i { font-size: 18px; margin-bottom: 2px; }
            .dv-tab-btn.active { color: var(--primary-color); border-top: 2px solid var(--primary-color); font-weight: 600; }
            body { padding-bottom: 52px; }
        }
    </style>
    <script src="/js/home_button.js" defer></script>
</head>
<body>
    <header>
        <div class="detail-header">
            <a class="home-button" href="/explore/" title="Home"><i class="fa fa-house"></i></a>
            <button class="exit-button" onclick="history.back()" title="Back">&times;</button>
            <h3 class="header-name light-foreground detail-title" id="page_title">Visit Detail</h3>
            <div class="detail-actions">
                <button id="btn_add_review" class="action-button" style="display:none;">+ Review</button>
                <button id="btn_edit" class="action-button" style="display:none;">Edit Visit</button>
                <button class="action-overflow-btn" id="action_menu_btn"><i class="fa fa-ellipsis-v"></i></button>
                <div class="action-overflow-panel" id="action_menu_panel"></div>
            </div>
            <div id="profile_container" style="margin-left:auto;"></div>
        </div>
    </header>
    <hr class="divider-header">

    <div class="row dv-content" id="dv_content">
        <!-- Left: Visit info -->
        <div class="col-lg-6 col-12 dv-pane dv-pane-detail" style="max-height:85vh; overflow-y:auto; padding:10px;">
            <div id="visit_card_container"></div>
        </div>

        <!-- Right: Map -->
        <div class="col-lg-6 col-12 dv-pane dv-pane-map" style="height:85vh; position:relative;">
            <div id="map" style="height:100%; width:100%; border-radius:var(--border-radius);"></div>
            <div id="btn_center" class="pf-zoom-btn" title="Zoom to pool" style="position:absolute; top:10px; left:10px; z-index:1000;">
                <i class="fa fa-crosshairs"></i><i class="fa fa-tint" aria-hidden="true"></i>
            </div>
        </div>
    </div>

    <!-- Mobile tab bar -->
    <div class="dv-tabs" id="dv_tabs">
        <button class="dv-tab-btn active" data-tab="detail"><i class="fa fa-info-circle"></i>Detail</button>
        <button class="dv-tab-btn" data-tab="map"><i class="fa fa-map"></i>Map</button>
    </div>

    <script>
    function initOverflowMenu(btnId, panelId, items) {
        let btn = document.getElementById(btnId);
        let panel = document.getElementById(panelId);
        if (!btn || !panel) return;
        items.forEach(item => {
            let el = document.createElement('button');
            el.className = 'action-button';
            el.textContent = item.label;
            el.addEventListener('click', () => { panel.classList.remove('show'); item.action(); });
            panel.appendChild(el);
        });
        btn.addEventListener('click', (e) => { e.stopPropagation(); panel.classList.toggle('show'); });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#' + panelId) && !e.target.closest('#' + btnId)) panel.classList.remove('show');
        });
    }
    </script>

    <script src="/js/console_manager.js"></script>
    <script src="/js/resource_manager.js"></script>
    <script src="/js/bootstrap_5.2.3.min.js"></script>
    <script src="/js/leaflet_1.9.4.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/esri-leaflet_3.0.12.js"></script>
    <script src="/js/app_messaging.js"></script>

    <script type="module">
        import { fetchVisitById, fetchVisitPhotos, fetchReviewsByVisit, deleteVisitById } from '/js/api.js';
        import { formatDate } from './js/utils.js';
        import { getUser } from '/js/auth.js';
        import { createMap, addPoolMarker } from '/js/map_common.js';
        import { setupProfileIcon } from '/js/profile_icon.js';
        import { renderVisitTabs } from '/js/visit_card.js';
        setupProfileIcon();

        const params = new URLSearchParams(window.location.search);
        const visitId = params.get('visitId');
        let visitMap = null;

        // Mobile tab switching
        const dvMobile = window.matchMedia('(max-width: 900px)');
        function dvSwitchTab(t) {
            let el = document.getElementById('dv_content');
            if (!el) return;
            el.dataset.activeTab = t;
            document.querySelectorAll('.dv-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
            if (t === 'map' && visitMap) setTimeout(() => visitMap.invalidateSize(), 100);
        }
        document.querySelectorAll('.dv-tab-btn').forEach(b => b.addEventListener('click', () => dvSwitchTab(b.dataset.tab)));
        dvMobile.addEventListener('change', (e) => {
            let el = document.getElementById('dv_content');
            if (!el) return;
            if (e.matches) { if (!el.dataset.activeTab) el.dataset.activeTab = 'detail'; }
            else { delete el.dataset.activeTab; }
            if (visitMap) setTimeout(() => visitMap.invalidateSize(), 150);
        });
        if (dvMobile.matches) { let el = document.getElementById('dv_content'); if (el) el.dataset.activeTab = 'detail'; }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!visitId) {
                document.getElementById('visit_card_container').innerHTML = '<p>No visit ID specified.</p>';
                return;
            }

            document.getElementById('page_title').textContent = `Visit ${visitId}`;

            try {
                let data = await fetchVisitById(visitId);
                let row = data.rows ? data.rows[0] : data;
                // The API returns { both: { visit: {...}, mapped: {...} } }
                let visit = row.both ? row.both.visit : row;
                let mapped = row.both ? row.both.mapped : row;
                if (!visit) {
                    document.getElementById('visit_card_container').innerHTML = '<p>Visit not found.</p>';
                    return;
                }

                // Descriptive title
                let poolId = visit.visitPoolId || mapped.mappedPoolId || '';
                let town = visit.townName || mapped.townName || '';
                let county = visit.countyName || mapped.countyName || '';
                let date = formatDate(visit.visitDate);
                let observer = visit.visitObserverUserName || visit.visitUserName || '';
                let loc = town ? `${town}${county ? ' (' + county + ')' : ''}` : '';
                let title = `Visit ${visitId} of pool ${poolId}`;
                if (loc) title += ` in ${loc}`;
                if (date) title += ` on ${date}`;
                if (observer) title += ` by ${observer}`;
                document.getElementById('page_title').textContent = title;
                document.title = `VPAtlas - ${title}`;

                // Fetch photos & reviews in parallel, then render the tabbed card
                let [photos, reviews] = await Promise.all([
                    fetchVisitPhotos(visitId).catch(() => []),
                    fetchReviewsByVisit(visitId).then(d => d.rows || (Array.isArray(d) ? d : [])).catch(() => [])
                ]);
                renderVisitTabs(document.getElementById('visit_card_container'), {
                    visit, mapped,
                    photos: Array.isArray(photos) ? photos : [],
                    reviews
                });
                initMap(visit, mapped);

                // Edit button (owner only), Review button (admins only)
                let user = await getUser();
                if (user) {
                    let isAdmin = user.userrole === 'admin';
                    let isOwner = (user.id && (user.id === visit.visitUserId || user.id === visit.visitObserverUserId))
                        || user.username === visit.visitUserName
                        || user.username === visit.visitObserverUserName;
                    // isReviewed comes from the EXISTS subquery on
                    // vpreview.reviewVisitId added in vpVisit.service.js.
                    let isReviewed = !!row.isReviewed;

                    let poolId = visit.visitPoolId || (mapped && mapped.mappedPoolId) || '';
                    let menuItems = [];

                    if (isOwner) {
                        let editBtn = document.getElementById('btn_edit');
                        editBtn.style.display = 'inline-block';
                        editBtn.addEventListener('click', () =>
                            window.location.href = `/survey/visit_create.html?visitId=${visitId}`);
                        menuItems.push({ label: 'Edit Visit', action: () => window.location.href = `/survey/visit_create.html?visitId=${visitId}` });
                    }

                    if (isAdmin) {
                        let reviewBtn = document.getElementById('btn_add_review');
                        reviewBtn.style.display = 'inline-block';
                        reviewBtn.addEventListener('click', () =>
                            window.location.href = `/admin/review_create.html?visitId=${visitId}&poolId=${poolId}`);
                        menuItems.push({ label: '+ Review', action: () => window.location.href = `/admin/review_create.html?visitId=${visitId}&poolId=${poolId}` });
                    }

                    // Delete: admins always; owners only if not yet reviewed.
                    // Server gates the same condition as defense in depth.
                    if (isAdmin || (isOwner && !isReviewed)) {
                        menuItems.push({
                            label: 'Delete Visit',
                            action: async () => {
                                if (!confirm(`Permanently delete visit #${visitId} from the server?`)) return;
                                try {
                                    await deleteVisitById(visitId);
                                    window.location.href = '/explore/visit_list.html';
                                } catch (e) {
                                    console.error('visit_view: delete failed', e);
                                    // Offline detection: TypeError from a
                                    // network-failed fetch, or navigator.onLine
                                    // false, or a fetch error message we
                                    // recognize. Server is unchanged.
                                    let offline = (typeof navigator !== 'undefined' && navigator.onLine === false)
                                        || (e instanceof TypeError)
                                        || /failed to fetch|networkerror|load failed/i.test(((e && e.message) || ''));
                                    if (offline) {
                                        alert("Can't reach the server — you appear to be offline. The visit was NOT deleted; try again when you're back online.");
                                        return;
                                    }
                                    let msg = (e && (e.message || e.detail))
                                        || (typeof e === 'string' ? e : JSON.stringify(e));
                                    alert(`Delete failed: ${msg}`);
                                }
                            }
                        });
                    }

                    menuItems.push({ label: 'System Info', action: () => window.location.href = '/explore/system.html' });
                    initOverflowMenu('action_menu_btn', 'action_menu_panel', menuItems);
                }
            } catch(err) {
                document.getElementById('visit_card_container').innerHTML =
                    `<p style="color:var(--danger-color);">Error: ${err.message || JSON.stringify(err)}</p>`;
            }
        });

        async function initMap(v, m) {
            let mLat = parseFloat(m.mappedLatitude);
            let mLng = parseFloat(m.mappedLongitude);
            let vLat = parseFloat(v.visitLatitude);
            let vLng = parseFloat(v.visitLongitude);
            let hasMapped = Number.isFinite(mLat) && Number.isFinite(mLng);
            let hasVisit  = Number.isFinite(vLat) && Number.isFinite(vLng);
            if (!hasMapped && !hasVisit) return;

            let status = m.poolStatus || m.mappedPoolStatus || 'Potential';
            let poolId = v.visitPoolId || m.mappedPoolId || '';
            let town   = v.townName || m.townName || '';
            let visitDate = v.visitDate ? String(v.visitDate).slice(0, 10) : '';

            // Center on whichever point we have; bounds-fit below if we have both.
            let initLat = hasMapped ? mLat : vLat;
            let initLng = hasMapped ? mLng : vLng;
            let map = await createMap('map', { center: [initLat, initLng], zoom: 16 });
            visitMap = map;

            // Mapped pool — CIRCLE (surveyLevel: 'potential' draws a circle).
            // Plotted first so the visit triangle stacks on top when they
            // overlap; the popup/tooltip wording makes the role unambiguous
            // regardless of which marker the user clicks.
            let mappedMarker = null;
            if (hasMapped) {
                mappedMarker = addPoolMarker(map, [mLat, mLng], {
                    status: status,
                    surveyLevel: 'potential',
                    size: 22,
                    tooltip: `Mapped pool location — ${poolId}${town ? ', ' + town : ''} (${status})`,
                    popup:
                        `<strong>Mapped pool location</strong><br>` +
                        `Pool ${poolId}<br>` +
                        `Status: ${status}` +
                        (town ? `<br>Town: ${town}` : '')
                });
            }

            // Visit — TRIANGLE (surveyLevel: 'visited').
            let visitMarker = null;
            if (hasVisit) {
                visitMarker = addPoolMarker(map, [vLat, vLng], {
                    status: status,
                    surveyLevel: 'visited',
                    size: 24,
                    tooltip: `Visit ${v.visitId} location${visitDate ? ' — ' + visitDate : ''}`,
                    popup:
                        `<strong>Visit location</strong><br>` +
                        `Visit ${v.visitId}` +
                        (visitDate ? `<br>Date: ${visitDate}` : '') +
                        `<br>Pool ${poolId}`
                });
            }

            // Bounds-fit when both coords exist and differ; otherwise stay
            // on the single-point view. fitBounds with a tiny tolerance
            // would zoom out unnecessarily when the two points are nearly
            // identical — guard with a coarse equality check.
            function fitBoth() {
                if (mappedMarker && visitMarker) {
                    let dLat = Math.abs(mLat - vLat);
                    let dLng = Math.abs(mLng - vLng);
                    if (dLat > 1e-6 || dLng > 1e-6) {
                        let bounds = L.featureGroup([mappedMarker, visitMarker]).getBounds();
                        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 18 });
                        return;
                    }
                }
                map.setView([initLat, initLng], 16);
            }
            fitBoth();

            // Rewire the recenter button: fit both, or recenter on the
            // single point we have.
            let centerBtn = document.getElementById('btn_center');
            if (centerBtn) {
                centerBtn.title = (mappedMarker && visitMarker)
                    ? 'Zoom to pool and visit'
                    : 'Zoom to pool';
                centerBtn.addEventListener('click', fitBoth);
            }
        }
    </script>
    <script src="/js/bandwidth_monitor.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
