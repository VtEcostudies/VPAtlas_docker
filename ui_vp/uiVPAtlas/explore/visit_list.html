<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VPAtlas - My Visits and Tracks</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2c5530">
    <link rel="stylesheet" href="/css/bootstrap_5.2.3.min.css">
    <link rel="stylesheet" href="/css/font-awesome_6.6.0.all.min.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/pool_list.css">
    <link rel="stylesheet" href="./css/modal.css">
    <link rel="stylesheet" href="/survey/css/visit_queue.css">
    <style>
        .vl-container { max-width: 750px; padding: 10px 16px; overflow-x: hidden; }
        .vl-empty { font-size: 14px; color: var(--text-muted, #666); padding: 12px 0; }
        .vl-header-row {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
        }
        .vl-header-row h5 { margin: 0; font-size: 15px; }
        .vl-sort { font-size: 13px; display: flex; gap: 4px; align-items: center; }
        .vl-sort select { font-size: 13px; padding: 2px 6px; border: 1px solid #ccc; border-radius: 4px; }

        /* Tab nav for Visits / Tracks */
        .vl-tabs {
            display: flex; gap: 0; margin: 0 -16px 12px -16px; padding: 0 16px;
            border-bottom: 2px solid #e5e7eb;
        }
        .vl-tab {
            background: none; border: none; padding: 8px 16px;
            font-size: 14px; font-weight: 600; color: var(--text-muted, #666);
            border-bottom: 3px solid transparent; margin-bottom: -2px;
            cursor: pointer;
        }
        .vl-tab.active {
            color: var(--primary-color); border-bottom-color: var(--primary-color);
        }
        .vl-tab .vl-badge {
            display: inline-block; min-width: 18px; padding: 0 6px;
            background: var(--primary-color); color: white;
            border-radius: 9px; font-size: 11px; line-height: 18px;
            text-align: center; margin-left: 4px;
        }
        .vl-panel { display: none; }
        .vl-panel.active { display: block; }
        /* Track-specific list styling — reuse vq-* classes from visit_queue.css */
        .vl-track-meta { font-size: 12px; color: var(--text-muted, #666); }
        .vl-track-pending { background: #fef3c7; color: #92400e; }
        .vl-track-uploaded { background: #d1fae5; color: #065f46; }
        .vl-track-failed { background: #fee2e2; color: #991b1b; }
        .vl-track-status {
            display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 11px; font-weight: 600; margin-right: 6px;
        }
        /* Inline counts (photos + species) shown next to the date/observer line */
        .vl-counts { display: inline-flex; gap: 8px; margin-left: 6px; vertical-align: middle; }
        .vl-count {
            display: inline-flex; align-items: center; gap: 3px;
            font-size: 12px; color: var(--text-muted, #666);
        }
        .vl-count i { font-size: 11px; }
        .vl-count.has { color: var(--primary-color); font-weight: 600; }
    </style>
    <script src="/js/home_button.js" defer></script>
</head>
<body>
    <header>
        <div class="detail-header">
            <a class="home-button" href="/explore/" title="Home"><i class="fa fa-house"></i></a>
            <button class="exit-button" onclick="history.back()" title="Back">&times;</button>
            <h3 class="header-name light-foreground detail-title" id="page_title">My Visits and Tracks</h3>
            <div id="profile_container" style="margin-left:auto;"></div>
        </div>
    </header>
    <hr class="divider-header">

    <div class="vl-container">
        <div class="vl-tabs">
            <button class="vl-tab active" data-tab="visits"><i class="fa fa-inbox"></i> Visits<span class="vl-badge" id="badge_visits" style="display:none;"></span></button>
            <button class="vl-tab" data-tab="tracks"><i class="fa fa-route"></i> Tracks<span class="vl-badge" id="badge_tracks" style="display:none;"></span></button>
        </div>

        <div class="vl-panel active" id="panel_visits">
            <div class="vl-header-row">
                <h5 id="list_title"><i class="fa fa-inbox"></i> Visits</h5>
                <div class="vl-sort">
                    <label>Sort:</label>
                    <select id="sort_select">
                        <option value="date-desc">Date (newest)</option>
                        <option value="date-asc">Date (oldest)</option>
                        <option value="pool-asc">Pool ID (A-Z)</option>
                        <option value="status">Status</option>
                    </select>
                </div>
            </div>

            <div id="visit_list" class="vq-list"></div>
            <div id="visit_empty" class="vl-empty" style="display:none;">No visits found.</div>
            <div id="visit_loading" class="vl-empty"><i class="fa fa-spinner fa-spin"></i> Loading...</div>
        </div>

        <div class="vl-panel" id="panel_tracks">
            <div class="vl-header-row">
                <h5><i class="fa fa-route"></i> Tracks</h5>
                <button class="btn btn-sm btn-outline-success" id="btn_upload_all" style="display:none;">
                    <i class="fa fa-cloud-arrow-up"></i> Upload all
                </button>
            </div>
            <div id="track_list" class="vq-list"></div>
            <div id="track_empty" class="vl-empty" style="display:none;">No tracks recorded yet. Start one from PoolFinder.</div>
            <div id="track_loading" class="vl-empty"><i class="fa fa-spinner fa-spin"></i> Loading...</div>
        </div>
    </div>

    <script src="/js/console_manager.js"></script>
    <script src="/js/resource_manager.js"></script>
    <script src="/js/bootstrap_5.2.3.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/bandwidth_monitor.js"></script>
    <script src="/js/app.js"></script>

    <script type="module">
        import { fetchVisits, createTrack, deleteTrack, deleteVisitById } from '/js/api.js';
        import { isOnline } from '/js/net_status.js';
        import { getLocal, setLocal } from '/js/storage.js';
        import { MY_VISITS_CACHE_KEY } from '/js/cache_keys.js';
        import { formatDate } from './js/utils.js';
        import { getUser } from '/js/auth.js';
        import { setupProfileIcon } from '/js/profile_icon.js';
        import { loadAllVisits, deleteVisit } from '/survey/js/visit_store.js';
        import { syncVisit } from '/survey/js/visit_sync.js';
        import {
            listQueue as listLocalTracks,
            deleteLocal as deleteLocalTrack,
            markUploaded as markTrackUploaded,
            syncFromServer as syncTracksFromServer
        } from '/survey/js/track_recorder.js';

        setupProfileIcon('profile_container');

        let currentUser = null;
        let allVisits = [];  // unified list of local + server visits
        let allTracks = [];  // unified list of local + server tracks
        let currentSort = 'date-desc';

        // Species count = number of indicator species observed (any sign of presence:
        // adults / egg masses / larvae / boolean flag for fairy shrimp & clams /
        // a free-form "Other Species" with a count or name). Mirrors the visibility
        // rules used by the visit_card species cards.
        function speciesCountFromFields(s) {
            if (!s) return 0;
            let n = (k) => {
                let v = s[k];
                if (v == null || v === '') return 0;
                let num = Number(v);
                return Number.isFinite(num) ? num : (v ? 1 : 0);
            };
            let count = 0;
            if (n('visitWoodFrogAdults') || n('visitWoodFrogEgg') || n('visitWoodFrogLarvae')) count++;
            if (n('visitSpsAdults')      || n('visitSpsEgg')      || n('visitSpsLarvae'))      count++;
            if (n('visitJesaAdults')     || n('visitJesaEgg')     || n('visitJesaLarvae'))     count++;
            if (n('visitBssaAdults')     || n('visitBssaEgg')     || n('visitBssaLarvae'))     count++;
            if (n('visitFairyShrimp'))      count++;
            if (n('visitFingerNailClams'))  count++;
            let otherName = (s.visitSpeciesOtherName || '').toString().trim();
            if (otherName || n('visitSpeciesOtherCount')) count++;
            return count;
        }

        // Local drafts may keep species fields either at the top level or inside
        // formData (visit_create writes through both paths historically). Check
        // both so the badge is right whether the visit is a fresh draft or a
        // resumed one.
        function speciesCountFromLocal(v) {
            return speciesCountFromFields({ ...(v.formData || {}), ...v });
        }

        // Local photos live in `v.photos` keyed by species (woodfrog, pool, etc.)
        // as an array of base64 entries. Sum across keys.
        function localPhotoCount(v) {
            let p = v && v.photos;
            if (!p || typeof p !== 'object') return 0;
            return Object.values(p).reduce((acc, arr) => acc + (Array.isArray(arr) ? arr.length : 0), 0);
        }

        function renderCountsHtml(photoCount, speciesCount, reviewCount) {
            return `<span class="vl-counts">
                <span class="vl-count ${photoCount ? 'has' : ''}" title="${photoCount} photo${photoCount === 1 ? '' : 's'}"><i class="fa fa-camera"></i>${photoCount}</span>
                <span class="vl-count ${speciesCount ? 'has' : ''}" title="${speciesCount} indicator species"><i class="fa fa-frog"></i>${speciesCount}</span>
                <span class="vl-count ${reviewCount ? 'has' : ''}" title="${reviewCount} review${reviewCount === 1 ? '' : 's'}"><i class="fa fa-clipboard-check"></i>${reviewCount}</span>
            </span>`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            currentUser = await getUser();

            if (!currentUser) {
                document.getElementById('page_title').textContent = 'Visits and Tracks (log in to see yours)';
            }

            wireTabs();
            await loadAll();
            await loadAllTracks();

            // Sort control
            document.getElementById('sort_select').addEventListener('change', (e) => {
                currentSort = e.target.value;
                renderList();
            });

            // Upload-all button
            document.getElementById('btn_upload_all').addEventListener('click', uploadAllPendingTracks);

            // Refresh on sync events
            window.addEventListener('visitSyncStatus', async (e) => {
                if (e.detail?.type === 'uploaded') await loadAll();
            });

            // Honor ?tab=tracks deep-link
            let initialTab = new URLSearchParams(location.search).get('tab');
            if (initialTab === 'tracks') activateTab('tracks');
        });

        // =====================================================================
        // Tab switching
        // =====================================================================
        function wireTabs() {
            document.querySelectorAll('.vl-tab').forEach(btn => {
                btn.addEventListener('click', () => activateTab(btn.dataset.tab));
            });
        }
        function activateTab(name) {
            document.querySelectorAll('.vl-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
            document.querySelectorAll('.vl-panel').forEach(p => p.classList.toggle('active', p.id === 'panel_' + name));
        }

        // =====================================================================
        // Load local + server visits into one unified list
        // =====================================================================
        async function loadAll() {
            let loading = document.getElementById('visit_loading');
            loading.style.display = 'block';

            // Local visits from IndexedDB. We don't allow editing of an
            // already-uploaded visit, so once a local copy has BOTH a
            // server_visit_id AND its photos confirmed uploaded, the
            // server row is the single source of truth — the local row is
            // pure redundant cache. Hide it from the list (still kept in
            // IndexedDB; the server-row dedupe below picks it up by
            // visitId). Locals with photos still pending stay visible so
            // the user knows there's outstanding work.
            let localVisits = [];
            try {
                let raw = await loadAllVisits();
                localVisits = raw
                    .filter(v => {
                        let isUploaded = v.status === 'uploaded' && v.server_visit_id;
                        let photosPending = v.photos_uploaded === false;
                        // Hide pure cache; keep drafts, complete, and
                        // uploaded-but-photos-pending.
                        return !(isUploaded && !photosPending);
                    })
                    .map(v => ({
                        source: 'local',
                        status: v.status || 'draft',
                        visit_uuid: v.visit_uuid,
                        server_visit_id: v.server_visit_id || null,
                        photos_uploaded: v.photos_uploaded,
                        visitId: v.server_visit_id || null,
                        visitPoolId: v.visitPoolId || v.formData?.visitPoolId || '',
                        visitDate: v.visitDate || v.formData?.visitDate || '',
                        visitObserverUserName: v.visitObserverUserName || v.formData?.visitObserverUserName || '',
                        townName: '',
                        poolStatus: '',
                        visitLocatePool: '',
                        last_modified: v.last_modified || v.created_at || '',
                        photoCount: localPhotoCount(v),
                        speciesCount: speciesCountFromLocal(v),
                    }));
            } catch(e) { console.warn('visit_list: local load failed', e); }

            // Server visits
            let serverVisits = [];
            let serverFetchError = null;        // surfaced in the empty-state UI
            let serverFetchUsername = null;     // shown in the diagnostic line

            // Map one raw server visit row → the list's row shape, and
            // dedup against local rows that already represent it (uploaded
            // from this device). Shared by the live-fetch path and the
            // offline snapshot-restore path so the two can't drift.
            function buildServerVisits(rawRows) {
                let localServerIds = new Set(localVisits.filter(v => v.server_visit_id).map(v => v.server_visit_id));
                return (rawRows || [])
                    .filter(v => !localServerIds.has(v.visitId))
                    .map(v => ({
                        source: 'server',
                        status: 'server',
                        visitId: v.visitId,
                        visitPoolId: v.visitPoolId || v.poolId || '',
                        visitDate: v.visitDate || '',
                        visitObserverUserName: v.visitObserverUserName || v.visitUserName || '',
                        townName: v.townName || '',
                        poolStatus: v.poolStatus || v.mappedPoolStatus || '',
                        visitLocatePool: v.visitLocatePool || '',
                        // Ownership + review-status fields drive the
                        // "Delete" button gate. Mirror the visit_view
                        // owner check (ids preferred, names as fallback
                        // for legacy rows that pre-date visitUserId).
                        visitUserId: v.visitUserId,
                        visitUserName: v.visitUserName || '',
                        visitObserverUserId: v.visitObserverUserId,
                        // reviewCount + photoCount come from per-row
                        // subqueries on the visits service. isReviewed is
                        // derived for the delete-gate logic below.
                        reviewCount: Number(v.reviewCount || 0),
                        isReviewed: Number(v.reviewCount || 0) > 0,
                        photoCount: Number(v.photoCount || 0),
                        speciesCount: speciesCountFromFields(v),
                        // Server-side timestamps. createdAt is the first
                        // insert; updatedAt advances on every edit.
                        visitCreatedAt: v.visitCreatedAt || v.createdAt || null,
                        visitUpdatedAt: v.visitUpdatedAt || v.updatedAt || null,
                    }));
            }

            // Offline / failed-fetch fallback: restore the last snapshot of
            // this user's server visits taken while online. Same paradigm as
            // pool_cache / track syncFromServer — a static snapshot so the
            // field user can still see (and locally edit) their uploaded
            // visits without a network. Guarded by userId so a stale
            // snapshot from a previous user is never shown.
            async function restoreServerSnapshot() {
                try {
                    let snap = await getLocal(MY_VISITS_CACHE_KEY);
                    if (snap && snap.userId === currentUser.id && Array.isArray(snap.rows)) {
                        serverVisits = buildServerVisits(snap.rows);
                        let when = snap.ts ? new Date(snap.ts).toLocaleString() : 'unknown';
                        serverFetchUsername = `id=${currentUser.id} (offline — cached snapshot from ${when})`;
                    } else {
                        serverFetchUsername = `id=${currentUser.id} (offline — no cached snapshot yet)`;
                    }
                } catch (e) {
                    console.warn('visit_list: snapshot restore failed', e);
                    serverFetchUsername = `id=${currentUser.id} (offline)`;
                }
            }

            if (currentUser) {
                // Query by visitObserverUserId — the stable id that's
                // forever associated with this user (migration 011 backfilled
                // it on every legacy row). One id beats the old multi-name
                // IN(...) query that had to chase handle/username drift.
                if (currentUser.id == null) {
                    serverFetchError = 'Logged-in user has no id — cannot identify owner.';
                    serverFetchUsername = currentUser.username || currentUser.handle || currentUser.email || '(none)';
                } else if (!(await isOnline())) {
                    // OFFLINE: never fetch (SW 503 → scary error over what is
                    // a normal offline state — see the OFFLINE contract).
                    // Restore the online snapshot instead so uploaded visits
                    // remain visible and locally editable.
                    await restoreServerSnapshot();
                } else {
                    try {
                        serverFetchUsername = `id=${currentUser.id}`;
                        let data = await fetchVisits(`visitObserverUserId=${currentUser.id}`);
                        let rows = data.rows || (Array.isArray(data) ? data : []);
                        serverVisits = buildServerVisits(rows);
                        // Snapshot the RAW rows so the offline path runs the
                        // exact same mapper + dedup. Per-user, timestamped.
                        try {
                            await setLocal(MY_VISITS_CACHE_KEY, {
                                userId: currentUser.id, ts: Date.now(), rows
                            });
                        } catch (e) { console.warn('visit_list: snapshot save failed', e); }
                    } catch (e) {
                        // Online but the fetch failed (flaky signal, server
                        // hiccup). Per the OFFLINE contract: fall back to the
                        // cached snapshot silently rather than erroring.
                        console.warn('visit_list: server load failed, using snapshot', e);
                        await restoreServerSnapshot();
                    }
                }
            }

            allVisits = [...localVisits, ...serverVisits];
            loading.style.display = 'none';
            renderList(serverFetchError, serverFetchUsername);
        }

        // Pool-status → CSS class for the colored badge. Mirrors
        // pool_list.js getStatusClass; the `.status-*` rules live in
        // /explore/css/pool_list.css (already loaded by this page).
        function poolStatusClass(status) {
            switch (status) {
                case 'Confirmed':  return 'status-confirmed';
                case 'Probable':   return 'status-probable';
                case 'Potential':  return 'status-potential';
                case 'Duplicate':  return 'status-duplicate';
                case 'Eliminated': return 'status-eliminated';
                default: return '';
            }
        }

        // =====================================================================
        // Render unified list
        // =====================================================================
        function renderList(serverFetchError, serverFetchUsername) {
            let container = document.getElementById('visit_list');
            let empty = document.getElementById('visit_empty');
            let title = document.getElementById('list_title');

            let sorted = sortVisits(allVisits, currentSort);
            title.innerHTML = `<i class="fa fa-inbox"></i> Visits (${sorted.length})`;

            // If the server fetch failed (or returned nothing for an
            // identifiable reason), surface that inline so the user can see
            // it on iPhone PWA where there's no console. Saves another
            // round-trip of "what does the screen actually show".
            if (serverFetchError) {
                empty.innerHTML = `
                    <div style="color:#7c2d12; padding:8px 0;">
                        <strong>Couldn't load server visits.</strong><br>
                        <span style="font-size:12px;">Reason: ${escapeHtml(serverFetchError)}</span>
                        ${serverFetchUsername ? `<br><span style="font-size:12px;">Queried as: ${escapeHtml(serverFetchUsername)}</span>` : ''}
                    </div>
                    ${sorted.length ? '' : '<div style="padding-top:8px;">No local visits either.</div>'}
                `;
                empty.style.display = 'block';
            } else if (!sorted.length) {
                empty.textContent = 'No visits found.';
                container.innerHTML = '';
                empty.style.display = 'block';
                return;
            } else {
                empty.style.display = 'none';
            }

            let html = '';
            sorted.forEach(v => {
                let statusHtml, actions;

                if (v.source === 'local') {
                    // A local row with server_visit_id is an edit-in-progress
                    // of an existing server visit (dedup hides the server
                    // row in favor of this). It IS both: the visit lives on
                    // the server AND has local pending edits — show both
                    // pills. Underlying v.status (draft/complete) drives
                    // the action buttons but not the pill label here.
                    let isEditOfServer = !!v.server_visit_id;
                    if (v.status === 'uploaded') {
                        // From-this-device upload; if photos are still
                        // pending we surface that, otherwise it's the
                        // green check + a "server" origin pill.
                        let photoNote = (v.photos_uploaded === false) ? ' <i class="fa fa-image" title="Photos pending"></i>' : '';
                        statusHtml = `<span class="vq-status vq-status-uploaded">server</span>`;
                        actions = `<span class="vq-btn" style="color:#2e7d32; border:none;"><i class="fa fa-check"></i>${photoNote}</span>`;
                    } else if (isEditOfServer) {
                        statusHtml =
                            `<span class="vq-status vq-status-uploaded">server</span>` +
                            `<span class="vq-status vq-status-edited">edited</span>`;
                        if (v.status === 'draft') {
                            actions = `
                                <button class="vq-btn vq-edit" data-uuid="${v.visit_uuid}" title="Edit"><i class="fa fa-pen"></i></button>
                                <button class="vq-btn vq-upload" data-uuid="${v.visit_uuid}" title="Upload"><i class="fa fa-cloud-arrow-up"></i></button>
                                <button class="vq-btn vq-delete" data-uuid="${v.visit_uuid}" title="Discard edits"><i class="fa fa-trash"></i></button>`;
                        } else { // 'complete'
                            actions = `
                                <button class="vq-btn vq-upload" data-uuid="${v.visit_uuid}" title="Upload"><i class="fa fa-cloud-arrow-up"></i></button>
                                <button class="vq-btn vq-delete" data-uuid="${v.visit_uuid}" title="Discard edits"><i class="fa fa-trash"></i></button>`;
                        }
                    } else if (v.status === 'draft') {
                        statusHtml = `<span class="vq-status vq-status-draft">draft</span>`;
                        actions = `
                            <button class="vq-btn vq-edit" data-uuid="${v.visit_uuid}" title="Edit"><i class="fa fa-pen"></i></button>
                            <button class="vq-btn vq-upload" data-uuid="${v.visit_uuid}" title="Upload"><i class="fa fa-cloud-arrow-up"></i></button>
                            <button class="vq-btn vq-delete" data-uuid="${v.visit_uuid}" title="Delete"><i class="fa fa-trash"></i></button>`;
                    } else { // 'complete' fresh new visit
                        statusHtml = `<span class="vq-status vq-status-complete">complete</span>`;
                        actions = `
                            <button class="vq-btn vq-upload" data-uuid="${v.visit_uuid}" title="Upload"><i class="fa fa-cloud-arrow-up"></i></button>
                            <button class="vq-btn vq-delete" data-uuid="${v.visit_uuid}" title="Delete"><i class="fa fa-trash"></i></button>`;
                    }
                } else {
                    // server visit
                    statusHtml = `<span class="vq-status vq-status-uploaded">server</span>`;
                    let parts = [`<a class="vq-btn" href="visit_view.html?visitId=${v.visitId}" title="View"><i class="fa fa-eye"></i></a>`];
                    // Owner-and-unreviewed → render delete. Admin can also
                    // delete via this same control. Server gates again
                    // server-side as defense-in-depth.
                    if (canDeleteServerVisit(v)) {
                        parts.push(`<button class="vq-btn vq-server-delete" data-visit-id="${v.visitId}" title="Delete this visit"><i class="fa fa-trash"></i></button>`);
                    }
                    actions = parts.join('');
                }

                let poolLink = v.visitPoolId
                    ? `<a href="pool_view.html?poolId=${v.visitPoolId}" style="color:inherit; text-decoration:underline;">${v.visitPoolId}</a>`
                    : '—';
                let dateStr = formatDate(v.visitDate);
                let detail = [dateStr, v.townName].filter(Boolean).join(' — ');
                let idStr = v.visitId ? `#${v.visitId}` : '';

                let countsHtml = renderCountsHtml(v.photoCount || 0, v.speciesCount || 0, v.reviewCount || 0);

                // Pool-status badge — matches the home page list. Server
                // visits carry `poolStatus` from the JOIN; local drafts
                // don't have it, so we skip the badge for those.
                let poolStatusHtml = v.poolStatus
                    ? `<span class="status-badge ${poolStatusClass(v.poolStatus)}">${v.poolStatus}</span> `
                    : '';

                html += `<div class="vq-item">
                    <div class="vq-info">
                        <div>${statusHtml} ${poolStatusHtml}${poolLink} <span style="color:var(--text-muted); font-size:12px;">${idStr}</span>${countsHtml}</div>
                        <div class="vq-date">${detail}${v.visitObserverUserName ? ' — ' + v.visitObserverUserName : ''}</div>
                    </div>
                    <div class="vq-actions">${actions}</div>
                </div>`;
            });

            container.innerHTML = html;
            wireActions(container);
        }

        // =====================================================================
        // Wire action buttons
        // =====================================================================
        function wireActions(container) {
            container.querySelectorAll('.vq-edit').forEach(btn => {
                btn.addEventListener('click', () => {
                    window.location.href = `/survey/visit_create.html?local=${btn.dataset.uuid}`;
                });
            });

            container.querySelectorAll('.vq-upload').forEach(btn => {
                btn.addEventListener('click', async () => {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';
                    await syncVisit(btn.dataset.uuid);
                    await loadAll();
                });
            });

            container.querySelectorAll('.vq-delete').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (confirm('Delete this saved visit?')) {
                        await deleteVisit(btn.dataset.uuid);
                        await loadAll();
                    }
                });
            });

            // Server-side delete (own + unreviewed). The button is only
            // rendered when canDeleteServerVisit() said so — but the server
            // also gates, so worst-case the user gets a clear 403.
            container.querySelectorAll('.vq-server-delete').forEach(btn => {
                btn.addEventListener('click', async () => {
                    let visitId = btn.dataset.visitId;
                    if (!confirm(`Permanently delete visit #${visitId} from the server?`)) return;
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';
                    let succeeded = false;
                    let offlineError = false;
                    try {
                        await deleteVisitById(visitId);
                        succeeded = true;
                    } catch(e) {
                        console.error('Server visit delete failed', e);
                        if (isLikelyOfflineError(e)) {
                            offlineError = true;
                            alert("Can't reach the server — you appear to be offline. The visit was NOT deleted; try again when you're back online.");
                        } else {
                            alert(`Delete failed: ${describeError(e)}`);
                        }
                    }
                    if (offlineError) {
                        // Skip loadAll() — refetching server visits offline
                        // would empty the list and make it look like a bunch
                        // of visits had vanished. Just restore the trash icon.
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fa fa-trash"></i>';
                    } else {
                        await loadAll();
                    }
                });
            });
        }

        // Owner = matches by id (preferred) or by username (fallback for
        // legacy rows with no visitUserId). Mirrors visit_view.html.
        function isOwnServerVisit(v) {
            if (!currentUser) return false;
            let uid = currentUser.id;
            let uname = currentUser.handle || currentUser.username;
            return (uid != null && (uid === v.visitUserId || uid === v.visitObserverUserId))
                || (uname && (uname === v.visitUserName || uname === v.visitObserverUserName));
        }
        function canDeleteServerVisit(v) {
            if (!currentUser) return false;
            if (currentUser.userrole === 'admin') return true;
            return isOwnServerVisit(v) && !v.isReviewed;
        }

        // =====================================================================
        // Tracks: load local queue + server-side tracks (own + all-for-admin),
        // merge by remoteId, render, wire upload/delete.
        // =====================================================================
        async function loadAllTracks() {
            let loading = document.getElementById('track_loading');
            loading.style.display = 'block';

            // Pull the user's server-side tracks into the local queue first
            // (track_recorder.syncFromServer handles dedupe by remoteId and
            // is a no-op when offline / unauthed). Then render straight from
            // the queue — it now holds both locally-recorded and server-stub
            // entries, each tagged with its `source`.
            if (currentUser) {
                try { await syncTracksFromServer(); }
                catch(e) { console.warn('tracks: server sync failed', e); }
            }

            let queue = [];
            try { queue = await listLocalTracks(); } catch(e) { console.warn('tracks: local load failed', e); }

            allTracks = queue.map(t => ({
                source: t.source || 'local',  // legacy entries pre-source-field
                localId: t.localId,
                remoteId: t.remoteId || null,
                name: t.name,
                notes: t.notes,
                startedAt: t.startedAt,
                endedAt: t.endedAt,
                // Server stubs report pointCount from the API; locally-recorded
                // tracks count their actual point array.
                pointCount: Array.isArray(t.points) ? t.points.length : (t.pointCount || 0),
                lengthM: t.lengthM ?? null,
                uploadedAt: t.uploadedAt,
                accuracyMinM: t.accuracyMinM
            }));

            // Sort newest first by startedAt
            allTracks.sort((a, b) => (b.startedAt || '').localeCompare(a.startedAt || ''));

            loading.style.display = 'none';
            renderTracks();
        }

        function renderTracks() {
            let container = document.getElementById('track_list');
            let empty = document.getElementById('track_empty');
            let badge = document.getElementById('badge_tracks');
            let uploadAllBtn = document.getElementById('btn_upload_all');

            badge.textContent = allTracks.length;
            badge.style.display = allTracks.length ? '' : 'none';

            let pending = allTracks.filter(t => t.source === 'local' && !t.remoteId);
            uploadAllBtn.style.display = pending.length > 1 ? '' : 'none';

            if (!allTracks.length) {
                container.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            let html = '';
            allTracks.forEach(t => {
                let statusClass, statusLabel, actions;
                // Every track row gets a View button that opens it on PoolFinder.
                // Server-side tracks reach the server by trackId; local-only
                // tracks (not yet uploaded) reach via the localId so the
                // PoolFinder reads the points straight from IndexedDB.
                let viewParam = (t.source === 'local' && !t.remoteId)
                    ? `localTrackId=${encodeURIComponent(t.localId)}`
                    : `trackId=${encodeURIComponent(t.remoteId)}`;
                let viewBtn = `<a class="vq-btn" href="/survey/find_pool.html?${viewParam}" title="View on map"><i class="fa fa-eye"></i></a>`;
                if (t.source === 'local' && !t.remoteId) {
                    statusClass = 'vl-track-pending';
                    statusLabel = 'queued';
                    actions = `
                        ${viewBtn}
                        <button class="vq-btn track-upload" data-local="${t.localId}" title="Upload"><i class="fa fa-cloud-arrow-up"></i></button>
                        <button class="vq-btn track-delete-local" data-local="${t.localId}" title="Delete locally"><i class="fa fa-trash"></i></button>`;
                } else if (t.source === 'local' && t.remoteId) {
                    statusClass = 'vl-track-uploaded';
                    statusLabel = 'uploaded';
                    actions = `${viewBtn} <button class="vq-btn track-delete-local" data-local="${t.localId}" title="Remove from device"><i class="fa fa-trash"></i></button>`;
                } else {
                    statusClass = 'vl-track-uploaded';
                    statusLabel = 'server';
                    actions = `${viewBtn} <button class="vq-btn track-delete-remote" data-remote="${t.remoteId}" data-local="${t.localId}" title="Delete from server"><i class="fa fa-trash"></i></button>`;
                }

                let dateStr = t.startedAt ? new Date(t.startedAt).toLocaleString() : '';
                let durationMin = t.startedAt && t.endedAt
                    ? Math.round((new Date(t.endedAt) - new Date(t.startedAt)) / 60000)
                    : null;
                let lengthStr = t.lengthM != null ? `${(t.lengthM/1000).toFixed(2)} km` : '';
                let detail = [
                    `${t.pointCount} pts`,
                    durationMin ? `${durationMin} min` : '',
                    lengthStr
                ].filter(Boolean).join(' · ');

                html += `<div class="vq-item">
                    <div class="vq-info">
                        <div><span class="vl-track-status ${statusClass}">${statusLabel}</span> ${t.name || 'Track'} ${t.remoteId ? `<span style="color:var(--text-muted); font-size:12px;">#${t.remoteId}</span>` : ''}</div>
                        <div class="vl-track-meta">${dateStr}${detail ? ' — ' + detail : ''}</div>
                    </div>
                    <div class="vq-actions">${actions}</div>
                </div>`;
            });

            container.innerHTML = html;
            wireTrackActions(container);
        }

        function wireTrackActions(container) {
            container.querySelectorAll('.track-upload').forEach(btn => {
                btn.addEventListener('click', async () => {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';
                    await uploadOneTrack(btn.dataset.local);
                });
            });
            container.querySelectorAll('.track-delete-local').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('Remove this track from this device? (Server copy, if any, is not affected.)')) return;
                    await deleteLocalTrack(btn.dataset.local);
                    await loadAllTracks();
                });
            });
            container.querySelectorAll('.track-delete-remote').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('Permanently delete this track from the server?')) return;
                    try { await deleteTrack(btn.dataset.remote); }
                    catch(e) {
                        console.error('Track delete failed', e);
                        alert(`Delete failed: ${describeError(e)}\n\nTrack #${btn.dataset.remote}`);
                        return;
                    }
                    // Remove the orphaned local stub so the row doesn't reappear
                    // until the next sync. (Sync only adds/updates; it doesn't
                    // remove server-deleted entries from local.)
                    if (btn.dataset.local) {
                        try { await deleteLocalTrack(btn.dataset.local); } catch(_) {}
                    }
                    await loadAllTracks();
                });
            });
        }

        // Heuristic: did this failure happen because we're offline? Browsers
        // throw a plain TypeError ("Failed to fetch" / "Load failed" /
        // "NetworkError when attempting to fetch resource") for network-down
        // fetch failures. navigator.onLine is the strongest signal when
        // available; the message-text fallbacks catch the cases where it's
        // unreliable (some captive-portal setups).
        function isLikelyOfflineError(e) {
            if (typeof navigator !== 'undefined' && navigator.onLine === false) return true;
            if (e instanceof TypeError) return true;
            let m = ((e && e.message) || '').toLowerCase();
            return m.includes('failed to fetch')
                || m.includes('networkerror')
                || m.includes('load failed');
        }

        // Cheap HTML escaper for the inline error UI. Anything user-derived
        // (usernames, error messages from the server) goes through here
        // before being injected with innerHTML.
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        // Mobile-only debugging means we can't open devtools, so every error
        // alert needs to surface as much detail as possible. This walks the
        // common shapes thrown from /js/api.js (parsed JSON bodies, fetch
        // TypeErrors, hand-thrown {message, status, ...} objects, raw strings)
        // and ends with a JSON.stringify fallback so no error becomes the
        // useless "[object Object]".
        function describeError(e) {
            if (e == null) return '(no error info)';
            if (typeof e === 'string') return e;
            let parts = [];
            if (e.status) parts.push(`HTTP ${e.status}`);
            if (e.name && e.name !== 'Error') parts.push(e.name);
            if (typeof e.message === 'string' && e.message) parts.push(e.message);
            if (typeof e.error === 'string' && e.error) parts.push(`error=${e.error}`);
            if (e.detail) parts.push(`detail=${typeof e.detail === 'string' ? e.detail : JSON.stringify(e.detail)}`);
            if (e.hint) parts.push(`hint=${e.hint}`);
            if (e.code) parts.push(`code=${e.code}`);
            if (e.constraint) parts.push(`constraint=${e.constraint}`);
            if (e.column) parts.push(`column=${e.column}`);
            if (e.routine) parts.push(`routine=${e.routine}`);
            if (e.query) parts.push(`url=${e.query}`);
            if (parts.length === 0) {
                try {
                    let s = JSON.stringify(e);
                    if (s && s !== '{}') return s;
                } catch(_) {}
                // Fallback: enumerate own properties
                try {
                    let pairs = Object.getOwnPropertyNames(e).map(k => {
                        let v = e[k];
                        if (typeof v === 'function') return null;
                        try { return `${k}=${typeof v === 'object' ? JSON.stringify(v) : String(v)}`; }
                        catch(_) { return `${k}=?`; }
                    }).filter(Boolean);
                    if (pairs.length) return pairs.join(' | ');
                } catch(_) {}
                return String(e);
            }
            return parts.join(' — ');
        }

        async function uploadOneTrack(localId) {
            let local = (await listLocalTracks()).find(t => t.localId === localId);
            if (!local) {
                alert(`Upload failed: track ${localId} not found in local queue (was it already deleted?)`);
                return;
            }
            // Pre-flight sanity check with descriptive errors so we don't
            // round-trip the server with a known-bad payload.
            let pts = Array.isArray(local.points) ? local.points : [];
            if (pts.length < 2) {
                alert(`Upload failed: track has only ${pts.length} point(s) — need at least 2.`);
                return;
            }
            let bad = pts.findIndex(p =>
                !Array.isArray(p) || p.length < 2 ||
                !Number.isFinite(p[0]) || !Number.isFinite(p[1])
            );
            if (bad !== -1) {
                alert(`Upload failed: point #${bad} is not a finite [lng, lat]. Got: ${JSON.stringify(pts[bad])}`);
                return;
            }
            try {
                let result = await createTrack({
                    name: local.name,
                    notes: local.notes,
                    startedAt: local.startedAt,
                    endedAt: local.endedAt,
                    points: pts
                });
                if (result && result.trackId) {
                    await markTrackUploaded(localId, result.trackId);
                } else {
                    alert(`Upload returned no trackId. Server response: ${JSON.stringify(result || null)}`);
                }
            } catch(e) {
                console.error('Track upload failed', e);
                alert(`Upload failed: ${describeError(e)}\n\n` +
                      `Track: ${localId}\n` +
                      `Points: ${pts.length}\n` +
                      `Started: ${local.startedAt}\n` +
                      `Ended: ${local.endedAt || '(none)'}`);
            }
            await loadAllTracks();
        }

        async function uploadAllPendingTracks() {
            let pending = (await listLocalTracks()).filter(t => !t.remoteId);
            for (let t of pending) {
                await uploadOneTrack(t.localId);
            }
        }

        // =====================================================================
        // Sort
        // =====================================================================
        function sortVisits(list, mode) {
            let sorted = [...list];
            switch (mode) {
                case 'date-asc':
                    sorted.sort((a, b) => (a.visitDate || '').localeCompare(b.visitDate || ''));
                    break;
                case 'date-desc':
                    sorted.sort((a, b) => (b.visitDate || '').localeCompare(a.visitDate || ''));
                    break;
                case 'pool-asc':
                    sorted.sort((a, b) => (a.visitPoolId || '').localeCompare(b.visitPoolId || ''));
                    break;
                case 'status':
                    let order = { draft: 0, complete: 1, uploaded: 2, server: 3 };
                    sorted.sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9));
                    break;
                default:
                    sorted.sort((a, b) => (b.visitDate || '').localeCompare(a.visitDate || ''));
            }
            return sorted;
        }
    </script>
</body>
</html>
