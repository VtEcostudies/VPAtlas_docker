<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VPAtlas - Review</title>
    <link rel="stylesheet" href="/css/bootstrap_5.2.3.min.css">
    <link rel="stylesheet" href="/css/font-awesome_6.6.0.all.min.css">
    <link rel="stylesheet" href="/css/leaflet_1.9.4.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/explore/css/common.css">
    <link rel="stylesheet" href="/explore/css/modal.css">
    <link rel="stylesheet" href="/explore/css/pool_list.css">
    <link rel="stylesheet" href="/css/map.css">
    <link rel="stylesheet" href="/css/visit_card.css">
    <style>
        .form-section {
            margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; padding: 10px;
        }
        .form-section-title {
            font-size: 15px; font-weight: 600; color: var(--primary-color); margin-bottom: 8px;
        }
        .form-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        .form-field { flex: 1; min-width: 120px; }
        .form-field label {
            display: block; font-size: 13px; font-weight: 600; margin-bottom: 2px; color: var(--text-secondary);
        }
        .form-field input, .form-field textarea, .form-field select {
            width: 100%; font-size: 16px; padding: 8px; border: 1px solid var(--primary-color); border-radius: 6px;
        }
        .form-field textarea { resize: vertical; min-height: 60px; }
        .choice-group { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
        .choice-group label {
            display: flex; align-items: center; gap: 4px; padding: 6px 10px;
            border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
            font-weight: normal; cursor: pointer; white-space: nowrap;
        }
        .choice-group label:has(input:checked) {
            background: var(--primary-color); color: white; border-color: var(--primary-color);
        }
        .choice-group input[type="radio"],
        .choice-group input[type="checkbox"] { width: auto; margin: 0; accent-color: var(--primary-color); }
        .msg { padding: 4px 10px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg.info { background: #d1ecf1; color: #0c5460; }
        .msg.success { background: #d4edda; color: #155724; }
        .msg.error { background: #f8d7da; color: #721c24; }

        /* Reassign Visit — destructive admin action, distinct from normal save */
        .reassign-section { border-color: #c44; background: #fff8f8; }
        .reassign-btn { background: #c44; color: white; }
        .reassign-btn:hover { background: #a33; }
        .suggestion-box {
            position: absolute; top: 100%; left: 0; right: 0;
            background: white; border: 1px solid #ccc; border-radius: 4px;
            max-height: 200px; overflow-y: auto; z-index: 10; display: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .suggestion-item { padding: 6px 10px; cursor: pointer; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: var(--primary-light); }
        .suggestion-empty { padding: 6px 10px; font-size: 13px; color: #888; font-style: italic; }

        /* Two-pane: review form left, visit detail right */
        .rc-pane { max-height: 85vh; overflow-y: auto; padding: 10px; }

        #visit_map_container { height: 50vh; min-height: 300px; position: relative; }
        #visit_map { height: 100%; width: 100%; border-radius: var(--border-radius); }
        #visit_map_center {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            background: white; border: 2px solid rgba(0,0,0,0.2); border-radius: 4px;
            height: 34px; padding: 0 8px; display: flex; align-items: center; gap: 4px; justify-content: center;
            cursor: pointer; color: #333; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        #visit_map_center i { font-size: 16px; }

        /* Mobile tabs */
        .rc-tabs { display: none; }
        @media (max-width: 900px) {
            .rc-pane {
                display: none !important; max-height: none !important;
                height: calc(100dvh - 90px - 52px) !important; min-height: 0;
            }
            .rc-content[data-active-tab="review"] .rc-pane-review { display: block !important; }
            .rc-content[data-active-tab="visit"]  .rc-pane-visit  { display: block !important; }
            .rc-content[data-active-tab] .rc-pane { flex: 0 0 100%; max-width: 100%; }
            .rc-tabs {
                display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
                border-top: 1px solid #ddd; background: white; box-shadow: 0 -2px 6px rgba(0,0,0,0.08);
            }
            .rc-tab-btn {
                flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
                padding: 6px 2px; border: none; background: white; color: var(--text-secondary);
                font-size: 11px; cursor: pointer; border-radius: 0;
            }
            .rc-tab-btn i { font-size: 18px; margin-bottom: 2px; }
            .rc-tab-btn.active { color: var(--primary-color); border-top: 2px solid var(--primary-color); font-weight: 600; }
            body { padding-bottom: 52px; }
        }
    </style>
    <script src="/js/home_button.js" defer></script>
</head>
<body>
    <header>
        <div class="detail-header">
            <a class="home-button" href="/explore/" title="Home"><i class="fa fa-house"></i></a>
            <button class="exit-button" onclick="history.back()" title="Back">&times;</button>
            <h3 class="header-name light-foreground detail-title" id="page_title">Review</h3>
            <button id="btn_save" class="action-button" style="font-size:14px; padding:4px 12px;">Save</button>
            <div id="profile_container" style="margin-left:auto;"></div>
        </div>
    </header>
    <hr class="divider-header">

    <div id="message" class="msg"></div>

    <div class="row rc-content" id="rc_content">
        <!-- Left: Review form -->
        <div class="col-lg-6 col-12 rc-pane rc-pane-review">
            <div class="form-section">
                <div class="form-section-title">Review Info</div>
                <div class="form-row">
                    <div class="form-field"><label for="reviewPoolId">Pool ID</label><input type="text" id="reviewPoolId" readonly></div>
                    <div class="form-field"><label for="reviewVisitId">Visit ID</label><input type="text" id="reviewVisitId" readonly></div>
                </div>
                <div class="form-row">
                    <div class="form-field"><label for="reviewQADate">QA Date</label><input type="date" id="reviewQADate"></div>
                    <div class="form-field"><label for="reviewQAPerson">QA Person</label><input type="text" id="reviewQAPerson"></div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-section-title">QA Code</div>
                <div class="choice-group">
                    <label><input type="radio" name="reviewQACode" value="CONF"> Confirmed</label>
                    <label><input type="radio" name="reviewQACode" value="PROB-VPMP"> Probable (VPMP)</label>
                    <label><input type="radio" name="reviewQACode" value="PROB-OTHER"> Probable (Other)</label>
                    <label><input type="radio" name="reviewQACode" value="LANDOWNER"> Landowner</label>
                    <label><input type="radio" name="reviewQACode" value="NOT FOUND"> Not Found</label>
                    <label><input type="radio" name="reviewQACode" value="NOT POOL"> Not Pool</label>
                    <label><input type="radio" name="reviewQACode" value="DUPLICATE"> Duplicate</label>
                    <label><input type="radio" name="reviewQACode" value="ERROR_Eliminate"> Error/Eliminate</label>
                    <label><input type="radio" name="reviewQACode" value="ERROR_LocAcc"> Error (Location)</label>
                </div>
                <div class="form-field"><label for="reviewQAAlt">QA Alt Code</label><input type="text" id="reviewQAAlt"></div>
            </div>

            <div class="form-section">
                <div class="form-section-title">Pool Status</div>
                <div class="choice-group">
                    <label><input type="radio" name="reviewPoolStatus" value="Potential"> Potential</label>
                    <label><input type="radio" name="reviewPoolStatus" value="Probable"> Probable</label>
                    <label><input type="radio" name="reviewPoolStatus" value="Confirmed"> Confirmed</label>
                    <label><input type="radio" name="reviewPoolStatus" value="Eliminated"> Eliminated</label>
                    <label><input type="radio" name="reviewPoolStatus" value="Duplicate"> Duplicate</label>
                </div>
                <label style="font-size:13px; font-weight:600; color:var(--text-secondary);">Pool Locator?</label>
                <div class="choice-group">
                    <label><input type="radio" name="reviewPoolLocator" value="true"> Yes</label>
                    <label><input type="radio" name="reviewPoolLocator" value="false"> No</label>
                </div>
            </div>

            <div class="form-section" id="reasons_section" style="display:none;">
                <div class="form-section-title">Reasons</div>
                <div class="choice-group" id="reasons_elim" style="display:none;">
                    <label><input type="checkbox" class="reviewReason" data-set="elim" value="Non-vernal pool wetland"> Non-vernal pool wetland</label>
                    <label><input type="checkbox" class="reviewReason" data-set="elim" value="Seep / spring"> Seep / spring</label>
                    <label><input type="checkbox" class="reviewReason" data-set="elim" value="Bad remote detection"> Bad remote detection</label>
                    <label><input type="checkbox" class="reviewReason" data-set="elim" value="Permanent water body (pond/lake/stream)"> Permanent water body</label>
                    <label><input type="checkbox" class="reviewReason" data-set="elim" value="Other (see notes)"> Other (see notes)</label>
                </div>
                <div class="choice-group" id="reasons_unconf" style="display:none;">
                    <label><input type="checkbox" class="reviewReason" data-set="unconf" value="Lacks landowner permission"> Lacks landowner permission</label>
                    <label><input type="checkbox" class="reviewReason" data-set="unconf" value="Lacks indicator species"> Lacks indicator species</label>
                    <label><input type="checkbox" class="reviewReason" data-set="unconf" value="Visit data incomplete / inconclusive"> Visit data incomplete / inconclusive</label>
                    <label><input type="checkbox" class="reviewReason" data-set="unconf" value="Awaiting follow-up visit"> Awaiting follow-up visit</label>
                </div>
            </div>

            <div class="form-section">
                <div class="form-section-title">Notes</div>
                <div class="form-field"><label for="reviewQANotes">QA Notes</label><textarea id="reviewQANotes" rows="3"></textarea></div>
            </div>

            <!-- Reassign Visit: admin-only, edit-mode-only. Moves the visit AND the review to a different mapped pool (one atomic transaction) and optionally marks the orphan pool 'Duplicate' or deletes it. -->
            <div class="form-section reassign-section" id="reassign_section" style="display:none;">
                <div class="form-section-title" style="color:#c44;">Reassign Visit (admin)</div>
                <p style="font-size:13px; color:var(--text-secondary); margin:4px 0 8px;">
                    Move this visit and review to a different existing pool. Use when a volunteer created a duplicate <code>NEW####</code> pool on top of a real one.
                </p>
                <div class="form-field" style="position:relative;">
                    <label for="reassign_target">Target pool ID</label>
                    <input type="text" id="reassign_target" placeholder="Type pool ID — e.g. MLS255" autocomplete="off">
                    <div id="reassign_suggestions" class="suggestion-box"></div>
                </div>
                <div id="reassign_preview" style="display:none; font-size:13px; padding:6px 10px; background:#fff3cd; border-radius:4px; margin:6px 0;"></div>
                <div id="reassign_fate_group" style="display:none; margin:6px 0;">
                    <label style="font-size:13px; font-weight:600; color:var(--text-secondary);">After moving the visit, the original pool should:</label>
                    <div class="choice-group">
                        <label><input type="radio" name="reassign_fate" value="duplicate" checked> Set to <strong>Duplicate</strong></label>
                        <label><input type="radio" name="reassign_fate" value="delete"> Delete</label>
                    </div>
                </div>
                <button id="btn_reassign" class="action-button reassign-btn" style="display:none; font-size:14px; padding:6px 14px;">Reassign Visit</button>
                <div id="reassign_msg" class="msg" style="margin-top:8px;"></div>
            </div>
        </div>

        <!-- Right: Full visit view with Detail/Map inner tabs -->
        <div class="col-lg-6 col-12 rc-pane rc-pane-visit">
            <div id="visit_loading" style="font-size:14px;">
                <p style="color:var(--text-muted);"><i class="fa fa-spinner fa-spin"></i> Loading visit data...</p>
            </div>
            <div id="visit_card_container" style="display:none;"></div>
        </div>
    </div>

    <!-- Mobile tab bar -->
    <div class="rc-tabs" id="rc_tabs">
        <button class="rc-tab-btn active" data-tab="review"><i class="fa fa-clipboard-check"></i>Review</button>
        <button class="rc-tab-btn" data-tab="visit"><i class="fa fa-eye"></i>Visit</button>
    </div>

    <script src="/js/console_manager.js"></script>
    <script src="/js/resource_manager.js"></script>
    <script src="/js/bootstrap_5.2.3.min.js"></script>
    <script src="/js/leaflet_1.9.4.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/esri-leaflet_3.0.12.js"></script>
    <script src="/js/app_messaging.js"></script>

    <script type="module">
        import { fetchReviewById, fetchVisitById, fetchVisitPhotos, createReview, updateReview, reassignReview, fetchPools } from '/js/api.js';
        import { requireAuth, getUser } from '/js/auth.js';
        import { createMap, addPoolMarker } from '/js/map_common.js';
        import { setupProfileIcon } from '/js/profile_icon.js';
        import { renderVisitTabs } from '/js/visit_card.js';
        setupProfileIcon();

        const params = new URLSearchParams(window.location.search);
        const reviewId = params.get('reviewId');
        const visitId = params.get('visitId');
        const poolId = params.get('poolId');
        const isEdit = !!reviewId;

        const textFields = ['reviewPoolId', 'reviewVisitId', 'reviewQADate', 'reviewQAPerson', 'reviewQAAlt', 'reviewQANotes'];
        const radioGroups = ['reviewQACode', 'reviewPoolStatus', 'reviewPoolLocator'];

        let visitMap = null;
        let visitLat = null, visitLng = null;

        // Mobile tab switching (review vs visit panes)
        const rcMobile = window.matchMedia('(max-width: 900px)');
        function rcSwitchTab(t) {
            let el = document.getElementById('rc_content');
            if (!el) return;
            el.dataset.activeTab = t;
            document.querySelectorAll('.rc-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
            if (t === 'visit' && visitMap) setTimeout(() => visitMap.invalidateSize(), 100);
        }
        document.querySelectorAll('.rc-tab-btn').forEach(b => b.addEventListener('click', () => rcSwitchTab(b.dataset.tab)));
        rcMobile.addEventListener('change', (e) => {
            let el = document.getElementById('rc_content');
            if (!el) return;
            if (e.matches) { if (!el.dataset.activeTab) el.dataset.activeTab = 'review'; }
            else { delete el.dataset.activeTab; }
        });
        if (rcMobile.matches) { let el = document.getElementById('rc_content'); if (el) el.dataset.activeTab = 'review'; }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!(await requireAuth())) return;
            let user = await getUser();
            if (!user || user.userrole !== 'admin') {
                document.getElementById('message').textContent = 'Admin access required.';
                document.getElementById('message').className = 'msg show error';
                return;
            }

            // Show/hide the Reasons section based on the selected pool status.
            document.querySelectorAll('input[name="reviewPoolStatus"]').forEach(r =>
                r.addEventListener('change', updateReasonsVisibility));

            if (isEdit) {
                document.getElementById('page_title').textContent = `Edit Review ${reviewId}`;
                try {
                    let data = await fetchReviewById(reviewId);
                    let review = data.rows ? data.rows[0] : (Array.isArray(data) ? data[0] : data);
                    if (review) {
                        populateForm(review);
                        // The review JOIN returns visit + mapped fields on one row.
                        let vid = review.visitId || review.reviewVisitId;
                        let photos = vid ? await fetchVisitPhotos(vid).catch(() => []) : [];
                        showVisitPane(review, review, photos);
                    }
                } catch(err) { showMsg('Error: ' + err.message, 'error'); }
            } else {
                document.getElementById('page_title').textContent = 'New Review';
                if (poolId) document.getElementById('reviewPoolId').value = poolId;
                if (visitId) document.getElementById('reviewVisitId').value = visitId;
                document.getElementById('reviewQADate').value = new Date().toLocaleDateString('sv-SE');
                if (user) {
                    document.getElementById('reviewQAPerson').value = user.handle || user.username || '';
                }
                updateReasonsVisibility();
                if (visitId) {
                    try {
                        let [vdata, photos] = await Promise.all([
                            fetchVisitById(visitId),
                            fetchVisitPhotos(visitId).catch(() => [])
                        ]);
                        let row = vdata.rows ? vdata.rows[0] : vdata;
                        let visit = row.both ? row.both.visit : row;
                        let mapped = row.both ? row.both.mapped : row;
                        showVisitPane(visit, mapped, Array.isArray(photos) ? photos : []);
                    } catch(err) {
                        document.getElementById('visit_loading').innerHTML =
                            `<p style="color:var(--danger-color);">Could not load visit: ${err.message}</p>`;
                    }
                }
            }

            // Save
            document.getElementById('btn_save').addEventListener('click', async () => {
                let body = getFormData();
                if (!body.reviewPoolId) { showMsg('Pool ID is required', 'error'); return; }
                if (user) {
                    body.reviewUserName = user.handle || user.username || user.email;
                    body.reviewUserId = user.id;
                }
                showMsg('Saving...', 'info');
                try {
                    if (isEdit) { await updateReview(reviewId, body); }
                    else { await createReview(body); }
                    showMsg('Saved!', 'success');
                    setTimeout(() => {
                        let vid = visitId || body.reviewVisitId;
                        if (vid) window.location.href = `/explore/visit_view.html?visitId=${vid}`;
                        else if (poolId) window.location.href = `/explore/pool_view.html?poolId=${poolId}`;
                        else window.location.href = '/explore/';
                    }, 1000);
                } catch(err) {
                    showMsg('Save failed: ' + (err.message || JSON.stringify(err)), 'error');
                }
            });

            // ─── Reassign Visit (admin, edit-mode only) ──────────────────
            // Only show the destructive section on an existing review for admin users.
            if (isEdit && user && user.userrole === 'admin') {
                document.getElementById('reassign_section').style.display = '';
                wireReassign();
            }
        });

        // ─── Reassign helpers ────────────────────────────────────────────

        function wireReassign() {
            const inp = document.getElementById('reassign_target');
            const sugBox = document.getElementById('reassign_suggestions');
            const preview = document.getElementById('reassign_preview');
            const fateGroup = document.getElementById('reassign_fate_group');
            const btn = document.getElementById('btn_reassign');
            let lastFetch = 0;

            // Show the fate radios + Reassign button as soon as the input has any
            // content. The button validates the pool exists on click (rather than
            // gating visibility on suggestion-click), so users who type the ID
            // directly aren't stuck.
            function reflectInputState() {
                let text = inp.value.trim();
                let hasText = text.length >= 2;
                let oldPool = document.getElementById('reviewPoolId').value;
                if (hasText) {
                    preview.innerHTML = `<strong>Will attempt:</strong> move visit ${document.getElementById('reviewVisitId').value} from <code>${oldPool}</code> → <code>${text}</code>. The review (<code>${reviewId}</code>) follows the visit automatically.`;
                    preview.style.display = 'block';
                    fateGroup.style.display = 'block';
                    btn.style.display = 'inline-block';
                } else {
                    preview.style.display = 'none';
                    fateGroup.style.display = 'none';
                    btn.style.display = 'none';
                }
            }

            inp.addEventListener('input', async () => {
                reflectInputState();
                const text = inp.value.trim();
                if (text.length < 2) { sugBox.style.display = 'none'; return; }
                const stamp = ++lastFetch;
                try {
                    let data = await fetchPools(`mappedPoolId|ILIKE=%${encodeURIComponent(text)}%&limit=15`);
                    if (stamp !== lastFetch) return;
                    let rows = (data && data.rows) || [];
                    let currentPoolId = document.getElementById('reviewPoolId').value;
                    let seen = new Set();
                    let html = '';
                    rows.forEach(row => {
                        let pid = row.mappedPoolId || row.poolId || '';
                        if (!pid || pid === currentPoolId || seen.has(pid)) return;
                        seen.add(pid);
                        let status = row.mappedPoolStatus || '';
                        let town = row.townName || '';
                        html += `<div class="suggestion-item" data-pool="${pid}" data-status="${status}" data-town="${town}">
                            <strong>${pid}</strong>
                            <span style="color:#888; font-size:12px;"> ${status}${town ? ' • ' + town : ''}</span>
                        </div>`;
                    });
                    if (!html) { sugBox.innerHTML = '<div class="suggestion-empty">No matching pools</div>'; sugBox.style.display = 'block'; return; }
                    sugBox.innerHTML = html;
                    sugBox.style.display = 'block';
                    sugBox.querySelectorAll('.suggestion-item').forEach(item => {
                        item.addEventListener('click', () => {
                            inp.value = item.dataset.pool;
                            sugBox.style.display = 'none';
                            reflectInputState();
                            inp.focus();
                        });
                    });
                } catch(err) {
                    sugBox.style.display = 'none';
                }
            });

            // Close the dropdown on outside click
            document.addEventListener('click', (e) => {
                if (!sugBox.contains(e.target) && e.target !== inp) sugBox.style.display = 'none';
            });

            btn.addEventListener('click', async () => {
                let target = inp.value.trim();
                let oldPool = document.getElementById('reviewPoolId').value;
                if (!target) { showReassignMsg('Type a target pool ID first.', 'error'); return; }
                if (target === oldPool) { showReassignMsg(`Already on ${target}. Pick a different pool.`, 'error'); return; }
                let fate = document.querySelector('input[name="reassign_fate"]:checked').value;
                let confirmMsg =
                    `Move visit ${document.getElementById('reviewVisitId').value} and review ${reviewId} from ${oldPool} → ${target}.\n\n` +
                    (fate === 'duplicate'
                        ? `Then set ${oldPool} status to 'Duplicate'.`
                        : `Then DELETE ${oldPool} from the atlas (only succeeds if no other visits/reviews/surveys reference it).`) +
                    `\n\nProceed?`;
                if (!window.confirm(confirmMsg)) return;
                btn.disabled = true;
                showReassignMsg('Reassigning…', 'info');
                try {
                    let result = await reassignReview(reviewId, { newPoolId: target, fate });
                    showReassignMsg(`Done. Visit and review now on ${result.newPoolId}. Reloading…`, 'success');
                    setTimeout(() => {
                        window.location.href = `/admin/review_create.html?reviewId=${reviewId}`;
                    }, 1200);
                } catch(err) {
                    btn.disabled = false;
                    showReassignMsg('Reassign failed: ' + (err.message || JSON.stringify(err)), 'error');
                }
            });
        }

        function showReassignMsg(text, type) {
            let el = document.getElementById('reassign_msg');
            el.textContent = text;
            el.className = 'msg show ' + type;
        }

        // ─── Visit pane: shared tabbed/card renderer + Map tab ───

        function showVisitPane(visit, mapped, photos) {
            let v = visit || {};
            let m = mapped || {};
            if (!v.visitId) {
                document.getElementById('visit_loading').innerHTML = '<p>No visit data available.</p>';
                return;
            }
            document.getElementById('visit_loading').style.display = 'none';
            let container = document.getElementById('visit_card_container');
            container.style.display = 'block';

            // Map tab content — populated by Leaflet after the panel becomes visible.
            let mapTab = {
                id: 'map', label: 'Map', icon: 'fa-map',
                html: `<div id="visit_map_container">
                    <div id="visit_map"></div>
                    <div id="visit_map_center" title="Zoom to pool"><i class="fa fa-crosshairs"></i><i class="fa fa-tint" aria-hidden="true"></i></div>
                </div>`
            };

            let handle = renderVisitTabs(container, {
                visit: v, mapped: m,
                photos: Array.isArray(photos) ? photos : [],
                extraTabs: [mapTab]
            });

            // Lazy-init the Leaflet map only after the Map tab is shown so the
            // container has non-zero dimensions; subsequent visits invalidateSize.
            handle.onTabChange(async (tabId) => {
                if (tabId !== 'map') return;
                if (!visitMap) await initVisitMap(v, m);
                else setTimeout(() => visitMap.invalidateSize(), 100);
            });
        }

        async function initVisitMap(v, m) {
            visitLat = parseFloat(v.visitLatitude || m.mappedLatitude);
            visitLng = parseFloat(v.visitLongitude || m.mappedLongitude);
            if (isNaN(visitLat) || isNaN(visitLng)) return;
            let status = m.mappedPoolStatus || m.poolStatus || 'Potential';
            let map = await createMap('visit_map', { center: [visitLat, visitLng], zoom: 16 });
            visitMap = map;
            let pid = v.visitPoolId || m.mappedPoolId || '';
            let town = v.townName || m.townName || '';
            addPoolMarker(map, [visitLat, visitLng], {
                status: status,
                surveyLevel: 'visited',
                size: 22,
                tooltip: `${pid} — ${status}${town ? ', ' + town : ''}`,
                popup: `Visit ${v.visitId} — Pool ${pid}`
            });
            document.getElementById('visit_map_center').addEventListener('click', () =>
                map.setView([visitLat, visitLng], 16));
            setTimeout(() => map.invalidateSize(), 100);
        }

        // ─── Review form helpers ───

        function populateForm(r) {
            textFields.forEach(f => {
                let el = document.getElementById(f);
                let val = r[f];
                if (el && val != null && val !== 'None') {
                    if (f === 'reviewQADate' && val) el.value = /^\d{4}-\d{2}-\d{2}$/.test(val) ? val : new Date(val).toLocaleDateString('sv-SE');
                    else el.value = val;
                }
            });
            radioGroups.forEach(name => {
                let val = r[name];
                if (val == null || val === 'None') return;
                if (typeof val === 'boolean') val = val.toString();
                let radio = document.querySelector(`input[name="${name}"][value="${val}"]`);
                if (radio) radio.checked = true;
            });
            let reasons = r.reviewReasons;
            if (Array.isArray(reasons)) {
                reasons.forEach(v => {
                    let cb = document.querySelector(`.reviewReason[value="${CSS.escape(v)}"]`);
                    if (cb) cb.checked = true;
                });
            }
            updateReasonsVisibility();
        }

        function updateReasonsVisibility() {
            let status = document.querySelector('input[name="reviewPoolStatus"]:checked')?.value;
            let showElim   = (status === 'Eliminated');
            let showUnconf = (status === 'Probable' || status === 'Potential');
            document.getElementById('reasons_section').style.display = (showElim || showUnconf) ? '' : 'none';
            document.getElementById('reasons_elim').style.display    = showElim   ? '' : 'none';
            document.getElementById('reasons_unconf').style.display  = showUnconf ? '' : 'none';
            // Clear the hidden set so submitted reasons always match the visible set
            document.querySelectorAll('.reviewReason').forEach(cb => {
                if ((cb.dataset.set === 'elim'   && !showElim) ||
                    (cb.dataset.set === 'unconf' && !showUnconf)) cb.checked = false;
            });
        }

        function getFormData() {
            let body = {};
            textFields.forEach(f => {
                let el = document.getElementById(f);
                if (el && el.value) body[f] = el.value;
            });
            radioGroups.forEach(name => {
                let radio = document.querySelector(`input[name="${name}"]:checked`);
                if (radio) {
                    let val = radio.value;
                    if (name === 'reviewPoolLocator') val = (val === 'true');
                    body[name] = val;
                }
            });
            // reviewReasons — always send (even empty) so flipping to Confirmed clears stale rows.
            let status = document.querySelector('input[name="reviewPoolStatus"]:checked')?.value;
            let activeSet = (status === 'Eliminated') ? 'elim'
                          : (status === 'Probable' || status === 'Potential') ? 'unconf'
                          : null;
            body.reviewReasons = activeSet
                ? Array.from(document.querySelectorAll(`.reviewReason[data-set="${activeSet}"]:checked`)).map(cb => cb.value)
                : [];
            return body;
        }

        function showMsg(text, type) {
            let el = document.getElementById('message');
            el.textContent = text;
            el.className = 'msg show ' + type;
            if (type === 'info' || type === 'success') {
                setTimeout(() => { el.className = 'msg'; }, 3000);
            }
        }
    </script>
    <script src="/js/bandwidth_monitor.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
