# dev.vpatlas.org + api.dev.vpatlas.org — placeholder (dev docker stack is offline)
#
# Serves a small "Not serving content" page on HTTPS so visitors don't get
# nginx's default 502 page. SSL cert at /etc/letsencrypt/live/dev.vpatlas.org/
# is a SAN cert covering both names — preserved as-is.
#
# To bring dev back later, replace this with the original
# deploy/nginx-dev.vpatlas.org.conf (UI) + deploy/nginx-api.dev.vpatlas.org.conf
# (API) and reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name dev.vpatlas.org api.dev.vpatlas.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.vpatlas.org api.dev.vpatlas.org;

    ssl_certificate     /etc/letsencrypt/live/dev.vpatlas.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.vpatlas.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        add_header Content-Type "text/html; charset=utf-8" always;
        return 503 '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Not serving content</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:32em;margin:4em auto;padding:0 1em;text-align:center;color:#444;line-height:1.5}h1{color:#2c5530;font-weight:500;margin-bottom:0.5em}a{color:#2c5530}</style></head><body><h1>Not serving content</h1><p>This service is offline. The Vermont Vernal Pool Atlas lives at <a href="https://vpatlas.org">vpatlas.org</a>.</p></body></html>';
    }
}
