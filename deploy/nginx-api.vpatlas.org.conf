# api.vpatlas.org — API reverse proxy for the new docker prod stack
#
# Replaces an earlier vhost that proxied to the legacy Angular API on 4322.
# The Let's Encrypt cert for api.vpatlas.org was issued at that time and is
# still valid; this config re-uses it.
#
# Upstream port 4011 is the EXTERNAL mapping on the prod docker stack's
# api_vp_prod container (see docker-compose-prod.yml). Dev's api_vp lives
# on 4010 — do not confuse them.
#
# If the cert path below ever moves, run:
#   sudo certbot --nginx -d api.vpatlas.org

server {
    listen 80;
    server_name api.vpatlas.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.vpatlas.org;

    ssl_certificate     /etc/letsencrypt/live/api.vpatlas.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vpatlas.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow up to ~25MB photo uploads (nginx default is 1MB).
    # api_vp_prod uses multer with limits.fileSize: 20*1024*1024.
    client_max_body_size 25M;

    # CORS — allow the new docker UI at vpatlas.org (post-cutover).
    add_header Access-Control-Allow-Origin "https://vpatlas.org" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Allow-Credentials "true" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── OGC API - Features (pg_featureserv, ogc_vp_prod on loopback 9011) ──────
    # Published as a path on this vhost rather than its own subdomain, so no new
    # DNS record or certificate is required.
    #
    # The trailing slash on proxy_pass strips the /ogc/ prefix, so the app sees
    # /collections; PGFS_SERVER_URLBASE=https://api.vpatlas.org/ogc puts the
    # prefix back on every self/items link it emits.
    #
    # CAVEAT -- CORS preflight. The server-level `if ($request_method = OPTIONS)`
    # above runs in the rewrite phase, BEFORE location selection, so an OPTIONS
    # request to /ogc/ returns 204 carrying the server-level
    # Access-Control-Allow-Origin: https://vpatlas.org, not the "*" set here.
    # Simple GETs (what OGC clients issue) are not preflighted, so this should
    # not matter. If ArcGIS Online turns out to send a preflight, the fix is to
    # move the OPTIONS handling out of the server block into each location.
    # OGC API - Features Part 5 (Schemas). Routed to the Node API rather than to
    # pg_featureserv, which serves no such resource and whose collection metadata
    # carries only name/type/description -- no length, no allowed values, no
    # format. A client pointed at the OGC route would otherwise have to infer
    # field widths, which is how the published ArcGIS layers acquired
    # String(4000) fields. A regex location takes precedence over the /ogc/
    # prefix below, so this wins for exactly this path.
    # OGC metadata resources, routed to the Node API so it can add the Part 5
    # schema link relation and conformance class that pg_featureserv cannot
    # emit. Without them the schema resource below exists but nothing advertises
    # it, so a conforming client never looks for it.
    #
    # /items is deliberately NOT proxied -- it is the heavy path, it needs
    # nothing added, and it keeps working if the API is down.
    #
    # Content negotiation is preserved: the API forwards Accept upstream and
    # passes HTML through untouched, so pg_featureserv's browse pages still work.
    #
    # ORDER MATTERS. nginx tries regex locations in the order written and takes
    # the first match, so the /schema location must stay ahead of the collection
    # one below or it would never be reached.
    location ~ ^/ogc/collections/([^/]+)/schema(\.json)?$ {
        proxy_pass http://127.0.0.1:4011/schema/ogc/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Same reasoning as the /ogc/ block: this vhost pins Allow-Origin to
        # vpatlas.org at server level, which would block ArcGIS Online.
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ ^/ogc/collections/([^/]+)$ {
        proxy_pass http://127.0.0.1:4011/ogcproxy/collections/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ ^/ogc/collections(\.json)?$ {
        proxy_pass http://127.0.0.1:4011/ogcproxy/collections;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ ^/ogc/conformance(\.json)?$ {
        proxy_pass http://127.0.0.1:4011/ogcproxy/conformance;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /ogc/ {
        proxy_pass http://127.0.0.1:9011/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # This vhost pins Allow-Origin to https://vpatlas.org at server level,
        # which would block ArcGIS Online -- its Map Viewer fetches from
        # arcgis.com. `add_header` in a location REPLACES inherited server-level
        # add_header directives rather than combining with them, so these win.
        # Everything served here is already public, read-only data.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
    }

    location / {
        proxy_pass http://127.0.0.1:4011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Express's cors() middleware emits its own Access-Control-Allow-* headers
        # (origin: *). Strip them upstream so nginx's server-level add_header set
        # above is the single source of truth. Without this, browsers see a
        # combined "*, https://vpatlas.org" value and reject the response.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
    }
}
