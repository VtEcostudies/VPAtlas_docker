# api.vpatlas.org — API reverse proxy for the new docker prod stack
#
# After installing, run:
#   sudo certbot --nginx -d api.vpatlas.org
# Certbot will add the SSL block and the http→https redirect automatically.
#
# Upstream port 4011 is the EXTERNAL mapping on the prod docker stack's
# api_vp_prod container (see docker-compose-prod.yml). Dev's api_vp container
# lives on 4010 — do not confuse them.

server {
    listen 80;
    server_name api.vpatlas.org;

    # Allow up to ~25MB photo uploads (nginx default is 1MB).
    # The api_vp_prod container uses multer with limits.fileSize: 20*1024*1024.
    client_max_body_size 25M;

    # CORS headers — allow vpatlas.org (the new docker UI, post-cutover)
    add_header Access-Control-Allow-Origin "https://vpatlas.org" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Allow-Credentials "true" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        proxy_pass http://127.0.0.1:4011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
