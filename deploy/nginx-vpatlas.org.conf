# vpatlas.org — UI reverse proxy for the new docker prod stack
#
# STAGED, NOT YET INSTALLED.
# This file replaces the legacy Angular vhost at cutover time.
# Activate it via:  ./deploy/deploy-prod.sh cutover
#
# The cutover script will:
#   1. Snapshot the existing /etc/nginx/sites-enabled/<legacy> vhost
#   2. Replace it with this file (already SSL-enabled, using the existing
#      Let's Encrypt cert at /etc/letsencrypt/live/vpatlas.org/)
#   3. nginx -t; on success reload; on failure restore the snapshot
#
# If the existing legacy vhost references certs at a non-standard path,
# adjust the ssl_certificate paths below before running cutover.

server {
    listen 80;
    server_name vpatlas.org www.vpatlas.org;

    # Force HTTPS
    return 301 https://vpatlas.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vpatlas.org www.vpatlas.org;

    ssl_certificate     /etc/letsencrypt/live/vpatlas.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpatlas.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow up to ~25MB uploads (matches api_vp_prod's multer limit).
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
