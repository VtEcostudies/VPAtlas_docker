#
# VPAtlas Docker Compose — vpatlas.org (new docker prod)
#
# Override for remote prod deployment at /home/ubuntu/VPAtlas_docker_production
# on the AWS server. Runs side-by-side with the legacy Angular app (until
# cutover) and with the docker dev stack (indefinitely), so container names
# and external ports are suffixed/shifted to avoid collisions.
#
# Usage:
#   docker compose -f docker-compose-vpatlas.yml -f docker-compose-prod.yml up -d
#
# Port Scheme (external; internal listen ports stay the same as base):
#   db=6551, api=4011, ui=8091
#
# Container names get a _prod suffix so they don't collide with dev's
# (db_vp, api_vp, ui_vp, db_migrate_vp) on the same docker host.
#

services:
  db_vp:
    container_name: db_vp_prod
    image: db_vp_prod
    # !override forces replacement; without it Compose MERGES the port
    # lists and dev's 5432:5432 would clash with prod also trying 6550.
    ports: !override
      - "6551:5432"

  db_migrate_vp:
    container_name: db_migrate_vp_prod
    image: db_vp_prod

  api_vp:
    container_name: api_vp_prod
    image: api_vp_prod
    environment:
      # API is proxied through nginx — no port in external URL
      API_PROT: https
      API_HOST: api.vpatlas.org
      API_PORT: 4010

      # UI host (for CORS / email confirmation URLs)
      UI_PROT: https
      UI_HOST: vpatlas.org
      UI_PORT: 80
    ports: !override
      - "4011:4010"

  ui_vp:
    container_name: ui_vp_prod
    image: ui_vp_prod
    environment:
      # API connection — proxied through nginx (no port in external URL)
      API_PROT: https
      API_HOST: api.vpatlas.org
      API_PORT: 443

      # UI host (external URL — nginx handles SSL on 443)
      UI_PROT: https
      UI_HOST: vpatlas.org
      # UI_PORT stays 8090 from base compose (internal listen port)
    ports: !override
      - "8091:8090"

  # OGC API - Features (pg_featureserv). Present in the base compose file, so it
  # WOULD start on prod without this override -- inheriting dev's container name
  # and dev's 9010 host port, both of which collide with the dev stack on this
  # same host. Hence the _prod suffix and shifted port, matching every other
  # service here.
  ogc_vp:
    container_name: ogc_vp_prod
    environment:
      # Fail the deploy loudly if the password is not in prod .env rather than
      # silently falling back to the dev default. This repo has already lost
      # months to an env var that interpolated to empty without complaint.
      DATABASE_URL: "postgres://pgfs_reader:${PGFS_PASSWORD:?PGFS_PASSWORD must be set in the prod .env}@db_vp:5432/vpatlas?sslmode=disable"

      # Published as a PATH on the existing api.vpatlas.org vhost -- no extra
      # DNS record and no extra certificate. Must include the /ogc prefix:
      # OGC responses are full of self/items links that clients (AGOL included)
      # follow verbatim, and nginx strips the prefix before proxying.
      PGFS_SERVER_URLBASE: "https://api.vpatlas.org/ogc"
    # Loopback only -- reachable solely by nginx on the same host, never
    # directly from the internet. Keep the 127.0.0.1 prefix.
    ports: !override
      - "127.0.0.1:9011:9000"
